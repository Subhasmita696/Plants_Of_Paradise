apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "paradise-plants.fullname" . }}-frontend-nginx
  labels:
    app: {{ include "paradise-plants.fullname" . }}
    component: frontend
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        gzip on;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
        gzip_min_length 1000;

        client_max_body_size 10M;
        root /usr/share/nginx/html;
        index index.html;

        location /api/catalog/ {
            proxy_pass http://{{ include "paradise-plants.fullname" . }}-backend:{{ .Values.backend.ports.catalog }}/api/plants/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/catalog {
            proxy_pass http://{{ include "paradise-plants.fullname" . }}-backend:{{ .Values.backend.ports.catalog }}/api/plants;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/inventory/ {
            proxy_pass http://{{ include "paradise-plants.fullname" . }}-backend:{{ .Values.backend.ports.inventory }}/api/inventory/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/inventory {
            proxy_pass http://{{ include "paradise-plants.fullname" . }}-backend:{{ .Values.backend.ports.inventory }}/api/inventory;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/orders/ {
            proxy_pass http://{{ include "paradise-plants.fullname" . }}-backend:{{ .Values.backend.ports.orders }}/api/orders/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/orders {
            proxy_pass http://{{ include "paradise-plants.fullname" . }}-backend:{{ .Values.backend.ports.orders }}/api/orders;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/care-reminders/ {
            proxy_pass http://{{ include "paradise-plants.fullname" . }}-backend:{{ .Values.backend.ports.careReminders }}/api/care-reminders/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/care-reminders {
            proxy_pass http://{{ include "paradise-plants.fullname" . }}-backend:{{ .Values.backend.ports.careReminders }}/api/care-reminders;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
