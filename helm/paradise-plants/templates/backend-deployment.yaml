apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paradise-plants.fullname" . }}-backend
  labels:
    app: {{ include "paradise-plants.fullname" . }}
    component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "paradise-plants.fullname" . }}
      component: backend
  template:
    metadata:
      labels:
        app: {{ include "paradise-plants.fullname" . }}
        component: backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.ports.catalog }}
            - containerPort: {{ .Values.backend.ports.inventory }}
            - containerPort: {{ .Values.backend.ports.orders }}
            - containerPort: {{ .Values.backend.ports.careReminders }}
          env:
            - name: DB_HOST
              value: "{{ .Values.backend.database.host }}"
            - name: DB_PORT
              value: "{{ .Values.backend.database.port }}"
            - name: DB_NAME
              value: "{{ .Values.backend.database.name }}"
            - name: DB_USER
              value: "{{ .Values.backend.database.user }}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "paradise-plants.fullname" . }}-backend
                  key: db-password
            - name: CATALOG_PORT
              value: "{{ .Values.backend.ports.catalog }}"
            - name: INVENTORY_PORT
              value: "{{ .Values.backend.ports.inventory }}"
            - name: ORDERS_PORT
              value: "{{ .Values.backend.ports.orders }}"
            - name: CARE_REMINDERS_PORT
              value: "{{ .Values.backend.ports.careReminders }}"
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.ports.catalog }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.ports.catalog }}
            initialDelaySeconds: 20
            periodSeconds: 20
