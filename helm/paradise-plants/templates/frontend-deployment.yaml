apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paradise-plants.fullname" . }}-frontend
  labels:
    app: {{ include "paradise-plants.fullname" . }}
    component: frontend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "paradise-plants.fullname" . }}
      component: frontend
  template:
    metadata:
      labels:
        app: {{ include "paradise-plants.fullname" . }}
        component: frontend
    spec:
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 6 }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
