replicaCount: 1

backend:
  image:
    repository: "REPLACE_WITH_ACR_LOGIN_SERVER/backend"
    tag: "latest"
    pullPolicy: IfNotPresent
  database:
    host: "REPLACE_WITH_MYSQL_HOST"
    port: 3306
    name: "paradise_plants"
    user: "paradise_user"
    password: "CHANGE_ME"
  ports:
    catalog: 3001
    inventory: 3002
    orders: 3003
    careReminders: 3004

frontend:
  image:
    repository: "REPLACE_WITH_ACR_LOGIN_SERVER/frontend"
    tag: "latest"
    pullPolicy: IfNotPresent
  port: 80

service:
  backend:
    type: ClusterIP
  frontend:
    type: LoadBalancer
    port: 80

imagePullSecrets: []
