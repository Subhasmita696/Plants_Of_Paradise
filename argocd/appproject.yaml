apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: paradise-plants
  namespace: argocd
  # Finalizer that ensures that project is not deleted until it is not referenced by any application
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Project description
  description: Paradise Plants e-commerce platform

  # Allow manifests to deploy from any Git repos
  sourceRepos:
    - '*'

  # Only permit applications to deploy to the paradise-plants namespace in the same cluster
  destinations:
    - namespace: paradise-plants
      server: https://kubernetes.default.svc

  # Deny all cluster-scoped resources from being created, except for Namespace
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace

  # Allow all namespaced-scoped resources to be created
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  # Deny all namespaced-scoped resources from being created
  namespaceResourceBlacklist:
    - group: ''
      kind: ResourceQuota
    - group: ''
      kind: LimitRange
    - group: ''
      kind: NetworkPolicy

  # Enables namespace orphaned resource monitoring.
  orphanedResources:
    warn: false

  # Sync windows for restricting sync hours
  syncWindows:
    - kind: allow
      schedule: '0 22 * * *'
      duration: 1h
      applications:
        - 'paradise-plants*'
      manualSync: true