apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paradise-plants
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Subhasmita696/Plants_Of_Paradise.git
    targetRevision: main
    path: helm/paradise-plants
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: paradise-plants
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
