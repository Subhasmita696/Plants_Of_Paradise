services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: paradise-mysql
    environment:
      MYSQL_ROOT_PASSWORD: paradise123
      MYSQL_DATABASE: paradise_plants
      MYSQL_USER: paradise_user
      MYSQL_PASSWORD: paradise123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/shared/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/shared/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - paradise-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uparadise_user", "-pparadise123"]
      timeout: 20s
      retries: 10
      interval: 10s
    restart: unless-stopped

  # Backend Services (All in one container)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paradise-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: paradise_user
      DB_PASSWORD: paradise123
      DB_NAME: paradise_plants
      PORT: 3001
      CATALOG_PORT: 3001
      INVENTORY_PORT: 3002
      ORDERS_PORT: 3003
      CARE_REMINDERS_PORT: 3004
    ports:
      - "3001:3001"
      - "3002:3002"
      - "3003:3003"
      - "3004:3004"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - paradise-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      timeout: 10s
      retries: 3
      interval: 30s

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paradise-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - paradise-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      timeout: 10s
      retries: 3
      interval: 30s

  # PhpMyAdmin for Database Management (Optional)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: paradise-phpmyadmin
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_USER: paradise_user
      PMA_PASSWORD: paradise123
      PMA_ROOT_PASSWORD: paradise123
    ports:
      - "8080:80"
    networks:
      - paradise-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  paradise-network:
    driver: bridge
