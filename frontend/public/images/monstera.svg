<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5016;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a0a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="#f0ede5"/>
  <!-- Pot -->
  <path d="M 120 380 L 140 480 L 260 480 L 280 380 Z" fill="#c9a876" stroke="#8b7355" stroke-width="2"/>
  <!-- Soil -->
  <ellipse cx="200" cy="380" rx="80" ry="20" fill="#8b7355" opacity="0.3"/>
  <!-- Main stem -->
  <line x1="200" y1="380" x2="200" y2="150" stroke="#4a6741" stroke-width="4" stroke-linecap="round"/>
  <!-- Left leaf with holes -->
  <ellipse cx="130" cy="250" rx="70" ry="90" fill="url(#leafGrad)" stroke="#1a3a0a" stroke-width="2"/>
  <circle cx="110" cy="240" r="20" fill="#f0ede5"/>
  <circle cx="135" cy="260" r="15" fill="#f0ede5"/>
  <!-- Right leaf with holes -->
  <ellipse cx="270" cy="200" rx="65" ry="85" fill="url(#leafGrad)" stroke="#1a3a0a" stroke-width="2" transform="rotate(25 270 200)"/>
  <circle cx="295" cy="190" r="18" fill="#f0ede5"/>
  <circle cx="265" cy="215" r="14" fill="#f0ede5"/>
  <!-- Upper left leaf -->
  <ellipse cx="140" cy="120" rx="55" ry="75" fill="url(#leafGrad)" stroke="#1a3a0a" stroke-width="2" transform="rotate(-20 140 120)"/>
  <circle cx="150" cy="100" r="16" fill="#f0ede5"/>
  <!-- Top leaf -->
  <ellipse cx="200" cy="80" rx="45" ry="65" fill="url(#leafGrad)" stroke="#1a3a0a" stroke-width="2"/>
  <circle cx="210" cy="70" r="14" fill="#f0ede5"/>
</svg>