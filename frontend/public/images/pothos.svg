<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d7c2c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a4d0a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="#f0ede5"/>
  <!-- Pot -->
  <ellipse cx="200" cy="420" rx="70" ry="25" fill="#d4a574" stroke="#8b7355" stroke-width="2"/>
  <path d="M 130 420 L 120 460 L 280 460 L 270 420" fill="#c9a876" stroke="#8b7355" stroke-width="2"/>
  <!-- Cascading vines with heart-shaped leaves -->
  <path d="M 200 400 Q 150 350 120 280 Q 100 240 80 180" stroke="#3d7c2c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 200 400 Q 250 350 280 260 Q 300 210 320 140" stroke="#3d7c2c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Left vine leaves -->
  <path d="M 120 280 Q 100 270 110 260 Q 125 255 135 265 Q 125 275 120 280" fill="url(#potGrad)" stroke="#1a4d0a" stroke-width="1.5"/>
  <path d="M 100 240 Q 75 235 85 220 Q 105 210 115 225 Q 100 235 100 240" fill="url(#potGrad)" stroke="#1a4d0a" stroke-width="1.5"/>
  <path d="M 80 180 Q 50 180 60 160 Q 85 145 100 160 Q 80 175 80 180" fill="url(#potGrad)" stroke="#1a4d0a" stroke-width="1.5"/>
  <!-- Right vine leaves -->
  <path d="M 280 260 Q 310 250 300 235 Q 275 225 270 245 Q 280 255 280 260" fill="url(#potGrad)" stroke="#1a4d0a" stroke-width="1.5"/>
  <path d="M 300 210 Q 335 200 325 180 Q 295 165 290 190 Q 300 205 300 210" fill="url(#potGrad)" stroke="#1a4d0a" stroke-width="1.5"/>
  <path d="M 320 140 Q 355 130 345 110 Q 310 90 310 120 Q 320 135 320 140" fill="url(#potGrad)" stroke="#1a4d0a" stroke-width="1.5"/>
</svg>