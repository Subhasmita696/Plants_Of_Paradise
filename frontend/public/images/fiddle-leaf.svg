<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fiddleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a7c2f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f4510;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="#f0ede5"/>
  <!-- Pot -->
  <path d="M 140 380 L 130 470 L 270 470 L 260 380 Z" fill="#c9a876" stroke="#8b7355" stroke-width="2"/>
  <!-- Main stem -->
  <line x1="200" y1="380" x2="200" y2="120" stroke="#4a6741" stroke-width="5" stroke-linecap="round"/>
  <!-- Large violin-shaped leaves -->
  <!-- Left lower leaf -->
  <path d="M 200 320 Q 130 310 110 360 Q 120 395 160 385 Q 190 378 200 340 Z" fill="url(#fiddleGrad)" stroke="#1f4510" stroke-width="2"/>
  <!-- Right lower leaf -->
  <path d="M 200 320 Q 270 310 290 360 Q 280 395 240 385 Q 210 378 200 340 Z" fill="url(#fiddleGrad)" stroke="#1f4510" stroke-width="2"/>
  <!-- Left middle leaf -->
  <path d="M 200 240 Q 120 230 95 290 Q 110 325 160 315 Q 190 308 200 260 Z" fill="url(#fiddleGrad)" stroke="#1f4510" stroke-width="2"/>
  <!-- Right middle leaf -->
  <path d="M 200 240 Q 280 230 305 290 Q 290 325 240 315 Q 210 308 200 260 Z" fill="url(#fiddleGrad)" stroke="#1f4510" stroke-width="2"/>
  <!-- Top leaf -->
  <path d="M 200 160 Q 140 140 125 210 Q 145 245 190 235 Q 200 220 200 180 Z" fill="url(#fiddleGrad)" stroke="#1f4510" stroke-width="2"/>
  <!-- Center vein on leaves -->
  <path d="M 200 320 Q 150 345 140 370" stroke="#6a9c5f" stroke-width="1.5" opacity="0.6" fill="none"/>
  <path d="M 200 320 Q 250 345 260 370" stroke="#6a9c5f" stroke-width="1.5" opacity="0.6" fill="none"/>
</svg>