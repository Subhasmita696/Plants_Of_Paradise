<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spiderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7a9c5e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d5a2f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="#f0ede5"/>
  <!-- Pot -->
  <ellipse cx="200" cy="420" rx="65" ry="20" fill="#d4a574" stroke="#8b7355" stroke-width="2"/>
  <path d="M 135 420 L 125 465 L 275 465 L 265 420" fill="#c9a876" stroke="#8b7355" stroke-width="2"/>
  <!-- Soil -->
  <ellipse cx="200" cy="420" rx="60" ry="15" fill="#8b7355" opacity="0.2"/>
  <!-- Center upright leaves -->
  <path d="M 195 400 Q 190 350 185 280 Q 182 200 190 120" stroke="#4a6741" stroke-width="3" fill="none"/>
  <path d="M 205 400 Q 210 350 215 280 Q 218 200 210 120" stroke="#4a6741" stroke-width="3" fill="none"/>
  <!-- Variegated leaf stripes -->
  <rect x="192" y="120" width="3" height="280" fill="#a8d47e" opacity="0.5"/>
  <rect x="205" y="120" width="3" height="280" fill="#a8d47e" opacity="0.5"/>
  <!-- Arching runner leaves -->
  <path d="M 200 330 Q 100 300 80 180 Q 70 120 75 60" stroke="#4a6741" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 200 330 Q 300 300 320 180 Q 330 120 325 60" stroke="#4a6741" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Dangling plantlets -->
  <circle cx="80" cy="180" r="12" fill="url(#spiderGrad)" stroke="#3d5a2f" stroke-width="1.5"/>
  <circle cx="320" cy="180" r="12" fill="url(#spiderGrad)" stroke="#3d5a2f" stroke-width="1.5"/>
  <!-- Plantlet leaves -->
  <ellipse cx="80" cy="170" rx="8" ry="14" fill="url(#spiderGrad)" stroke="#3d5a2f" stroke-width="1"/>
  <ellipse cx="320" cy="170" rx="8" ry="14" fill="url(#spiderGrad)" stroke="#3d5a2f" stroke-width="1"/>
</svg>