<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rubberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a8c3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f5a0f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="#f0ede5"/>
  <!-- Pot -->
  <path d="M 140 380 L 130 470 L 270 470 L 260 380 Z" fill="#c9a876" stroke="#8b7355" stroke-width="2"/>
  <!-- Main stem -->
  <line x1="200" y1="380" x2="200" y2="100" stroke="#4a6741" stroke-width="5" stroke-linecap="round"/>
  <!-- Large glossy leaves -->
  <!-- Lower left -->
  <ellipse cx="130" cy="320" rx="55" ry="45" fill="url(#rubberGrad)" stroke="#1f5a0f" stroke-width="2" opacity="0.9"/>
  <ellipse cx="130" cy="320" rx="50" ry="40" fill="#6aa84f" opacity="0.3"/>
  
  <!-- Lower right -->
  <ellipse cx="270" cy="300" rx="55" ry="45" fill="url(#rubberGrad)" stroke="#1f5a0f" stroke-width="2" opacity="0.9"/>
  <ellipse cx="270" cy="300" rx="50" ry="40" fill="#6aa84f" opacity="0.3"/>
  
  <!-- Middle left -->
  <ellipse cx="120" cy="210" rx="50" ry="42" fill="url(#rubberGrad)" stroke="#1f5a0f" stroke-width="2" opacity="0.9" transform="rotate(-20 120 210)"/>
  <ellipse cx="120" cy="210" rx="45" ry="37" fill="#6aa84f" opacity="0.3" transform="rotate(-20 120 210)"/>
  
  <!-- Middle right -->
  <ellipse cx="280" cy="190" rx="50" ry="42" fill="url(#rubberGrad)" stroke="#1f5a0f" stroke-width="2" opacity="0.9" transform="rotate(20 280 190)"/>
  <ellipse cx="280" cy="190" rx="45" ry="37" fill="#6aa84f" opacity="0.3" transform="rotate(20 280 190)"/>
  
  <!-- Top leaf -->
  <ellipse cx="200" cy="110" rx="45" ry="40" fill="url(#rubberGrad)" stroke="#1f5a0f" stroke-width="2" opacity="0.9"/>
  <ellipse cx="200" cy="110" rx="40" ry="35" fill="#6aa84f" opacity="0.3"/>
</svg>