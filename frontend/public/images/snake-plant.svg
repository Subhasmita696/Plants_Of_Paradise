<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5a7c3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d4a1f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="#f0ede5"/>
  <!-- Pot -->
  <path d="M 150 400 L 140 480 L 260 480 L 250 400 Z" fill="#c9a876" stroke="#8b7355" stroke-width="2"/>
  <!-- Soil -->
  <ellipse cx="200" cy="400" rx="50" ry="15" fill="#8b7355" opacity="0.3"/>
  <!-- Vertical leaves -->
  <rect x="175" y="100" width="20" height="300" fill="url(#snakeGrad)" stroke="#1a3a0a" stroke-width="1.5" rx="10"/>
  <line x1="185" y1="120" x2="185" y2="380" stroke="#7a9c5e" stroke-width="1" opacity="0.6"/>
  
  <rect x="205" y="80" width="18" height="320" fill="url(#snakeGrad)" stroke="#1a3a0a" stroke-width="1.5" rx="9" transform="skewX(5)"/>
  <line x1="214" y1="100" x2="214" y2="380" stroke="#7a9c5e" stroke-width="1" opacity="0.6"/>
  
  <!-- Side leaf -->
  <rect x="130" y="150" width="22" height="280" fill="url(#snakeGrad)" stroke="#1a3a0a" stroke-width="1.5" rx="11" transform="rotate(-15 141 290)"/>
  <line x1="141" y1="170" x2="141" y2="400" stroke="#7a9c5e" stroke-width="1" opacity="0.6" transform="rotate(-15 141 290)"/>
  
  <!-- Right side leaf -->
  <rect x="248" y="140" width="22" height="300" fill="url(#snakeGrad)" stroke="#1a3a0a" stroke-width="1.5" rx="11" transform="rotate(12 259 290)"/>
  <line x1="259" y1="160" x2="259" y2="410" stroke="#7a9c5e" stroke-width="1" opacity="0.6" transform="rotate(12 259 290)"/>
</svg>